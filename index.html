<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Admin Lengkap</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h1>Data Rekening</h1>
    <table id="tabel-rekening">
        <thead><tr id="tabel-header"></tr></thead>
        <tbody id="tabel-body"></tbody>
    </table>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwlNEEVw_Htu33d_9C2ZToiKEHNhUX94v1DU4PTQ8xyFdAHpuPeESeeYcg687kCTza5nw/exec"; // GANTI DENGAN URL WEB APP ANDA

        async function loadAllData() {
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getAllData" })
                });
                const result = await response.json();

                if (result.status === "success") {
                    renderFullTable(result.data.rekening);
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        function renderFullTable(data) {
            if (data.length === 0) return;

            // 1. Ambil nama header otomatis dari key objek pertama
            const headers = Object.keys(data[0]);
            const headerRow = document.getElementById("tabel-header");
            headerRow.innerHTML = headers.map(h => `<th>${h}</th>`).join("");

            // 2. Isi data baris otomatis
            const tbody = document.getElementById("tabel-body");
            tbody.innerHTML = data.map(item => {
                return `<tr>${headers.map(h => `<td>${item[h]}</td>`).join("")}</tr>`;
            }).join("");
        }

        window.onload = loadAllData;
    </script>
</body>
</html>
