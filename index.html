<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kios Absensi Barcode</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    
    .main-card { width: 100%; max-width: 400px; background: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h2 { color: #38bdf8; margin-bottom: 8px; font-size: 1.5rem; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }

    /* Tombol Pilihan Utama */
    .menu-container { display: flex; flex-direction: column; gap: 12px; }
    .btn-action { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; font-size: 1rem; color: #fff; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
    .btn-action:active { transform: scale(0.98); }
    .btn-masuk { background: #059669; }
    .btn-izin { background: #d97706; }
    .btn-pulang { background: #2563eb; }

    /* MODAL POP-UP SCANNER */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-content { background: #1e293b; width: 100%; max-width: 420px; border-radius: 20px; padding: 20px; text-align: center; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); position: relative; }
    
    .modal-header { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; color: #38bdf8; }
    .modal-info { font-size: 0.95rem; color: #e2e8f0; margin-bottom: 16px; font-weight: 500; }
    
    #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
    
    /* Status Result Box */
    #status-box { margin-top: 16px; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 0.95rem; display: none; }
    .status-masuk { background-color: #065f46; color: #34d399; border: 1px solid #059669; }
    .status-izin { background-color: #78350f; color: #fde047; border: 1px solid #d97706; }
    .status-pulang { background-color: #1e40af; color: #60a5fa; border: 1px solid #2563eb; }
    .status-error { background-color: #991b1b; color: #f87171; border: 1px solid #dc2626; }
    
    .btn-close { margin-top: 16px; background: #475569; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .loading { color: #38bdf8; font-size: 0.9rem; margin-top: 12px; display: none; }
  </style>
</head>
<body>

<!-- HALAMAN UTAMA -->
<div class="main-card">
  <h2>GROUP JL</h2>
  <p class="subtitle">Silakan pilih jenis kehadiran:</p>

  <div class="menu-container">
    <button class="btn-action btn-masuk" onclick="openScanner('MASUK')">ABSEN MASUK</button>
    <button class="btn-action btn-izin" onclick="openScanner('IZIN')">IZIN KELUAR/MASUK</button>
    <button class="btn-action btn-pulang" onclick="openScanner('PULANG')">ABSEN PULANG</button>
  </div>
</div>

<!-- POP-UP SCANNER MODAL -->
<div id="scanModal" class="modal-overlay">
  <div class="modal-content">
    <div id="modalHeader" class="modal-header">ABSEN MASUK</div>
    <div class="modal-info">Silahkan melakukan scan ID Card Anda</div>

    <div id="reader"></div>
    <div id="loading" class="loading">Memproses data...</div>
    <div id="status-box"></div>

    <button class="btn-close" onclick="closeScanner()">Batal / Tutup</button>
  </div>
</div>

<script>
  const SCRIPT_URL = "URL_GOOGLE_APPS_SCRIPT_ANDA_DI_SINI";

  let html5QrCode = null;
  let currentMode = "";
  let isScanningAllowed = true;

  // Buka Pop-up & Nyalakan Kamera
  function openScanner(mode) {
    currentMode = mode;
    document.getElementById('modalHeader').innerText = `SCAN ABSEN ${mode}`;
    document.getElementById('scanModal').style.display = 'flex';
    hideStatus();

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const config = { fps: 10, qrbox: { width: 220, height: 220 } };
    
    // Buka Kamera Belakang secara otomatis
    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
    .catch(err => {
      showStatus("Gagal membuka kamera: " + err, "status-error");
    });
  }

  // Matikan Kamera & Tutup Pop-up
  function closeScanner() {
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => {
        document.getElementById('scanModal').style.display = 'none';
      }).catch(err => console.log(err));
    } else {
      document.getElementById('scanModal').style.display = 'none';
    }
  }

  function onScanSuccess(decodedText) {
    if (!isScanningAllowed) return;

    isScanningAllowed = false;
    showLoading(true);
    hideStatus();

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        idCard: decodedText,
        mode: currentMode
      })
    })
    .then(res => res.json())
    .then(data => {
      showLoading(false);
      if (data.status === "success") {
        let cls = "status-masuk";
        if (data.type === "IZIN") cls = "status-izin";
        if (data.type === "PULANG") cls = "status-pulang";

        showStatus(`[${data.type}] ${data.nama}<br>${data.message}`, cls);
        
        // Otomatis tutup pop-up setelah 2.5 detik sukses scan
        setTimeout(() => {
          isScanningAllowed = true;
          closeScanner();
        }, 2500);
      } else {
        showStatus("Gagal: " + data.message, "status-error");
        setTimeout(() => { isScanningAllowed = true; }, 3000);
      }
    })
    .catch(err => {
      showLoading(false);
      showStatus("Kesalahan koneksi internet!", "status-error");
      setTimeout(() => { isScanningAllowed = true; }, 3000);
    });
  }

  function showLoading(show) {
    document.getElementById("loading").style.display = show ? "block" : "none";
  }

  function showStatus(text, className) {
    const box = document.getElementById("status-box");
    box.innerHTML = text;
    box.className = className;
    box.style.display = "block";
  }

  function hideStatus() {
    document.getElementById("status-box").style.display = "none";
  }
</script>

</body>
</html>
