<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Scanner Absensi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
    .modes { display: flex; gap: 8px; margin: 16px 0; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: #fff; opacity: 0.4; cursor: pointer; background: #334155; }
    .btn.active { opacity: 1; }
    .btn-masuk.active { background: #10b981; }
    .btn-izin.active { background: #f59e0b; }
    .btn-pulang.active { background: #3b82f6; }
    #reader { border-radius: 12px; overflow: hidden; background: #000; }
    #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; }
    .status-success { background: #065f46; color: #34d399; }
    .status-error { background: #991b1b; color: #f87171; }
  </style>
</head>
<body>
<div class="card">
  <h2>KIOSK ABSENSI</h2>
  <div class="modes">
    <button id="m-MASUK" class="btn btn-masuk active" onclick="setM('MASUK')">MASUK</button>
    <button id="m-IZIN" class="btn btn-izin" onclick="setM('IZIN')">IZIN</button>
    <button id="m-PULANG" class="btn btn-pulang" onclick="setM('PULANG')">PULANG</button>
  </div>
  <div id="reader"></div>
  <div id="status"></div>
</div>
<script>
  const URL = "https://script.google.com/macros/s/AKfycbyZd7J5SqvXa0SDy8Nirb1ENWGBApyagGuklEc_lQGm_kb2BiAdEGhMeEppv9PgHcJ8lA/exec";
  let mode = "MASUK", allowed = true;

  function setM(m) {
    mode = m;
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`m-${m}`).classList.add('active');
  }

  function onScan(code) {
    if(!allowed) return;
    allowed = false;
    
    fetch(URL, { method: "POST", body: JSON.stringify({ idCard: code, mode: mode }) })
    .then(r => r.json()).then(d => {
      let st = document.getElementById("status");
      st.style.display = "block";
      st.className = d.status === "success" ? "status-success" : "status-error";
      st.innerHTML = d.message;
      setTimeout(() => { st.style.display = "none"; allowed = true; }, 3000);
    });
  }

  new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 }).render(onScan);
</script>
</body>
</html>
