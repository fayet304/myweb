<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kios Absensi Barcode</title>
  <!-- Library html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 480px; background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h2 { margin-bottom: 8px; color: #38bdf8; font-size: 1.5rem; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
    #status-box { margin-top: 20px; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 1.1rem; display: none; }
    .status-masuk { background-color: #065f46; color: #34d399; border: 1px solid #059669; }
    .status-pulang { background-color: #1e40af; color: #60a5fa; border: 1px solid #2563eb; }
    .status-warning { background-color: #854d0e; color: #facc15; border: 1px solid #ca8a04; }
    .status-error { background-color: #991b1b; color: #f87171; border: 1px solid #dc2626; }
    .loading { color: #38bdf8; font-size: 0.95rem; margin-top: 15px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>KIOS ABSENSI</h2>
  <p class="subtitle">Arahkan barcode ID Card ke kamera</p>
  
  <div id="reader"></div>
  <div id="loading" class="loading">Memproses data...</div>
  <div id="status-box"></div>
</div>

<script>
  // GANTI URL DI BAWAH INI DENGAN WEB APP URL DARI GOOGLE APPS SCRIPT
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZd7J5SqvXa0SDy8Nirb1ENWGBApyagGuklEc_lQGm_kb2BiAdEGhMeEppv9PgHcJ8lA/exec";

  let isScanningAllowed = true;

  function onScanSuccess(decodedText) {
    if (!isScanningAllowed) return;
    
    isScanningAllowed = false; // Pause scan sejenak agar tidak spamming request
    showLoading(true);
    hideStatus();

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ idCard: decodedText })
    })
    .then(res => res.json())
    .then(data => {
      showLoading(false);
      if (data.status === "success") {
        const cls = data.type === "MASUK" ? "status-masuk" : "status-pulang";
        showStatus(`[${data.type}] ID: ${data.id}<br>${data.message} (${data.time})`, cls);
      } else if (data.status === "warning") {
        showStatus(data.message, "status-warning");
      } else {
        showStatus("Gagal: " + data.message, "status-error");
      }
      
      // Delay 3 detik sebelum scanner bisa membaca barcode berikutnya
      setTimeout(() => {
        isScanningAllowed = true;
        hideStatus();
      }, 3000);
    })
    .catch(err => {
      showLoading(false);
      showStatus("Terjadi kesalahan koneksi!", "status-error");
      setTimeout(() => { isScanningAllowed = true; hideStatus(); }, 3000);
    });
  }

  function showLoading(show) {
    document.getElementById("loading").style.display = show ? "block" : "none";
  }

  function showStatus(text, className) {
    const box = document.getElementById("status-box");
    box.innerHTML = text;
    box.className = className;
    box.style.display = "block";
  }

  function hideStatus() {
    document.getElementById("status-box").style.display = "none";
  }

  // Inisialisasi Scanner
  const html5QrcodeScanner = new Html5QrcodeScanner("reader", {
    fps: 10,
    qrbox: { width: 250, height: 250 },
    aspectRatio: 1.0
  }, false);

  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
